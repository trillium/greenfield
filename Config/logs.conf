# Where this project's logs are, for scripts/pull-logs.sh (docs/logs.md). Sourced as shell; no secrets belong here.
# One line per source, LOGS_T_<name>="<kind>|..." :
#   device|<part of the phone's name>|<path inside the app container>     devicectl copy, no cable
#   daemon|<host>|<port>                                                  GET /logs on a Mac's daemon (tailnet identity)
#   file|<path>                                                           a log file on this Mac
#   ssh|<ssh host>|<path on that host>|<only lines containing this text>  read-only tail over ssh
# The daemon's port comes from .env like everywhere else (scripts/load-env.sh); 47821 is the built-in default.
# shellcheck source-path=SCRIPTDIR/.. source=scripts/load-env.sh
. "$ROOT/scripts/load-env.sh"
LOGS_TARGETS="phone macbook mini0 trainer"
LOGS_DEFAULT_OUT="$HOME/Library/Logs/greenfield-pulled"

LOGS_T_phone="device|iPhone|Library/Application Support/support-log.txt"
LOGS_T_macbook="daemon|macbook.hippo-tilapia.ts.net|${GREENFIELD_PORT:-47821}"
LOGS_T_mini0="daemon|mini0.hippo-tilapia.ts.net|${GREENFIELD_PORT:-47821}"
# The sound trainer's service log on mini0 (job ids, sound names, accuracy, timings; it keeps no recordings in it).
LOGS_T_trainer="file|~/Library/Logs/parrot-trainer/trainer.log"
