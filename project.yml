# XcodeGen spec: the .xcodeproj is generated (`make generate`), never hand-edited or committed.
name: DictationApp
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.7
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  Moonshine:
    url: https://github.com/moonshine-ai/moonshine-swift.git
    exactVersion: 0.1.5
  # The shared package for the Parrot layer (model packs, teach flow, trainer), health and onboarding. A local checkout beside this one
  # (scripts/kit-dir.sh finds it; PARROT_KIT_DIR overrides). docs/teach-protocol.md.
  ParrotKit:
    path: ${PARROT_KIT_DIR}
targets:
  DictationApp:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # Staged by `make core` (never committed): the detector's model is personal training data.
      - path: .parrot-core/resources
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - package: ParrotKit
        product: KitAssist
      - package: ParrotKit
        product: KitAssistNet
      - package: ParrotKit
        product: KitCore
      - package: ParrotKit
        product: KitHealth
      - package: ParrotKit
        product: KitOnboarding
      - package: ParrotKit
        product: KitUI
      - package: ParrotKit
        product: ParrotKit
      - package: ParrotKit
        product: ParrotKitUI
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/App/ParrotCoreBridge.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/.parrot-core/include"]
        # One exact archive per SDK: both slices are called libparrot_core.a, so a search path could link the wrong one.
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["$(inherited)", "$(SRCROOT)/.parrot-core/device/libparrot_core.a"]
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ["$(inherited)", "$(SRCROOT)/.parrot-core/sim/libparrot_core.a"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/AppInfo.plist  # microphone usage text and the ATS exception for *.ts.net; the rest is generated
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: $(DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Skips the "export compliance" prompt on every TestFlight build; set to YES if you add non-exempt encryption.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  DictationAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
      - Spike/Sources/Core/SpikeMath.swift  # pure benchmark helpers, tested here
      # Shared byte for byte with the sibling project (docs/parity.md) and tested by a shared test that imports no app module.
      - App/Sources/Support/LogRedactor.swift
      - App/Sources/Support/LogBundle.swift
      - path: Spike/Phrases/phrases.json
        buildPhase: none
    dependencies:
      - target: DictationApp
      - package: ParrotKit
        product: KitAssist
      - package: ParrotKit
        product: KitAssistNet
      - package: ParrotKit
        product: KitCore
      - package: ParrotKit
        product: KitHealth
      - package: ParrotKit
        product: KitOnboarding
      - package: ParrotKit
        product: KitUI
      - package: ParrotKit
        product: ParrotKit
      - package: ParrotKit
        product: ParrotKitUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/.parrot-core/include"]
  DictationSpike:
    type: application
    platform: iOS
    sources:
      - Spike/Sources
      - path: Spike/Phrases/phrases.json
        buildPhase: resources
      - path: Spike/Audio  # made by tools/spike/make_phrases.sh, gitignored; absent in a fresh clone
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - package: Moonshine
        product: MoonshineVoice
    settings:
      base:
        SWIFT_VERSION: "5.0"  # the three speech packages predate strict Swift 6 concurrency
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).spike
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Dictation spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  DictationApp:
    build:
      targets:
        DictationApp: all
    test:
      targets: [DictationAppTests]
    archive:
      config: Release
  DictationSpike:
    build:
      targets:
        DictationSpike: all
