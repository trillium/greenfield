# XcodeGen spec: the .xcodeproj is generated (`make generate`), never hand-edited or committed.
name: DictationApp
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DictationApp:
    type: application
    platform: iOS
    sources: [App/Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/AppInfo.plist  # microphone usage text and the ATS exception for *.ts.net; the rest is generated
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: $(DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Skips the "export compliance" prompt on every TestFlight build; set to YES if you add non-exempt encryption.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  DictationAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/Tests]
    dependencies:
      - target: DictationApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
schemes:
  DictationApp:
    build:
      targets:
        DictationApp: all
    test:
      targets: [DictationAppTests]
    archive:
      config: Release
